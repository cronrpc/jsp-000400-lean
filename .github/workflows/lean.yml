name: Lean
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LEAN_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          auto-config: false
          build: true
          leanchecker: true
          leanchecker-args: >-
            Core TernaryForm Quantifiers PositiveWitness StandardForm FormStabilizer UnipotentGroups SmallVectors LatticeSpace MinimalInvariant CompactRepresentatives CompactLattices CompactStabilizers DiagonalContraction UpperUnipotentCompact Shearing ShearOrbit ShearLemma6C ShearFixedSpace ShearCurves ShearFixedRays ShearNormalization ShearFlag ConnectedCompactLimits CurveTruncation BoundaryBumping ShearOrbitClosure ShearDescent ShearLemma6B2 ShearB1 ShearCentralizer ShearNormalizer NilpotentSection ShearClosureLift UpperGeneration MargulisLemma6 UpperDiagonalEscape SignedShearEscape MinimalHitting GramShear GramCurves GramDescent GramOrbitClosure GramQuotient GramHull GramTriangular GramSection GramClosureLift MargulisLemma7 PrincipalRepresentation PrincipalFixed PrincipalFlag PrincipalCurves PrincipalDescent PrincipalSection NormalizerCoordinates PrincipalClosure MargulisLemma5 MinimalCollision LatticeCollision MinimalSubsystem OrbitQuotientTopology UnipotentOneNormalizer CompactGroupQuotient CompactHOrbit AffineSubgroup AffineTranslations AffineClassification AffineMatrixBridge PositiveNormalizerQuotient DiagonalInvariance CollisionInvariant MargulisTheorem2 IrrationalIntegerStabilizer NoncompactTernaryStabilizer StandardizedQuotient NoncompactOrbit ReducedBasisBounds MahlerCompactness MahlerPotential MahlerBasisChanges MahlerGram MahlerSizeReduction MahlerDualGram MahlerBoundedBasis FinalTheorem
          use-github-cache: false
      - name: Audit theorem axioms and fixed source
        run: python3 verify.py
